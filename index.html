<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>歷史與神話人物傳送門 - 小學四年級學習平台</title>
    <style>
        :root {
            --primary-color: #4A90E2;
            --bg-color: #F4F7F6;
            --card-bg: #FFFFFF;
            --text-color: #2C3E50;
            --accent-color: #FF9F43;
        }

        /* 角色主題顏色 */
        body.theme-pangu {
            --primary-color: #8B5A2B;
            --bg-color: #F5EBE0;
            --accent-color: #D4A373;
        }
        body.theme-qian {
            --primary-color: #1D3557;
            --bg-color: #E0E1DD;
            --accent-color: #457B9D;
        }
        body.theme-lai {
            --primary-color: #6C5CE7;
            --bg-color: #F0EDFD;
            --accent-color: #A29BFE;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: "PingFang HK", "Traditional Chinese", "Microsoft JhengHei", sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            transition: background-color 0.5s ease;
        }

        .container {
            width: 100%;
            max-width: 800px;
            height: 90vh;
            background: var(--card-bg);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
        }

        /* 頂部標題與設定區 */
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 15px 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: background-color 0.5s ease;
        }

        .header-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background-color: #FFF;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 26px;
            border: 2px solid white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        .title-text h1 {
            font-size: 1.2rem;
            font-weight: bold;
        }

        .title-text p {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        .settings-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 12px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        /* API Key 設定彈窗 */
        .modal {
            display: none;
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 15px;
            width: 90%;
            max-width: 450px;
        }

        .modal-content h3 { margin-bottom: 15px; }
        .modal-content input, .modal-content select {
            width: 100%;
            padding: 10px;
            margin-bottom: 12px;
            border: 1px solid #CCC;
            border-radius: 8px;
        }

        /* 對話內容區 */
        .chat-box {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .message {
            display: flex;
            flex-direction: column;
            max-width: 80%;
        }

        .message.bot {
            align-self: flex-start;
        }

        .message.user {
            align-self: flex-end;
        }

        .bubble {
            padding: 12px 18px;
            border-radius: 18px;
            font-size: 1rem;
            line-height: 1.5;
            word-break: break-word;
        }

        .bot .bubble {
            background-color: #EBF3FA;
            color: #2C3E50;
            border-bottom-left-radius: 4px;
        }

        .user .bubble {
            background-color: var(--primary-color);
            color: white;
            border-bottom-right-radius: 4px;
            transition: background-color 0.5s ease;
        }

        /* ABC 快速按鈕區 */
        .selection-panel {
            padding: 15px;
            background: #FAFAFA;
            border-top: 1px solid #EEE;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .char-btn {
            background: white;
            border: 2px solid var(--primary-color);
            color: var(--primary-color);
            padding: 12px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .char-btn:hover {
            background: var(--primary-color);
            color: white;
        }

        /* 輸入區 */
        .input-panel {
            padding: 15px;
            background: white;
            border-top: 1px solid #EEE;
            display: flex;
            gap: 10px;
        }

        .input-panel input {
            flex: 1;
            padding: 12px 15px;
            border: 1px solid #DDD;
            border-radius: 25px;
            font-size: 1rem;
            outline: none;
        }

        .input-panel button {
            background: var(--primary-color);
            color: white;
            border: none;
            padding: 0 20px;
            border-radius: 25px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.5s ease;
        }

        .input-panel button:disabled {
            background: #CCC;
            cursor: not-allowed;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div class="header-info">
            <div class="avatar" id="avatar">🚪</div>
            <div class="title-text">
                <h1 id="char-name">歷史與神話人物傳送門</h1>
                <p id="char-title">歡迎小學四年級同學訪問</p>
            </div>
        </div>
        <button class="settings-btn" onclick="toggleModal(true)">⚙️ 設定 API Key</button>
    </header>

    <div class="chat-box" id="chat-box">
        <!-- 系統預設開場白 -->
        <div class="message bot">
            <div class="bubble">
                各位四年級的小朋友，你好呀！歡迎來到「歷史與神話人物傳送門」！我是今天的時空導遊。今天有三位非常了不起的人物來到這裡，請點擊下方按鈕，選擇一位你想訪問的人物吧：
            </div>
        </div>
    </div>

    <!-- 角色選擇按鈕（初期顯示） -->
    <div class="selection-panel" id="selection-panel">
        <button class="char-btn" onclick="selectCharacter('A')">
            <span>👉</span> 【 A. 開天闢地的盤古 】
        </button>
        <button class="char-btn" onclick="selectCharacter('B')">
            <span>👉</span> 【 B. 航天科學巨匠錢學森 】
        </button>
        <button class="char-btn" onclick="selectCharacter('C')">
            <span>👉</span> 【 C. 港產首位女太空人黎家盈 】
        </button>
    </div>

    <!-- 文字輸入框（選定角色後顯示） -->
    <div class="input-panel" id="input-panel" style="display: none;">
        <input type="text" id="user-input" placeholder="請輸入你想問的問題..." onkeypress="handleKeyPress(event)">
        <button id="send-btn" onclick="sendMessage()">發送</button>
    </div>
</div>

<!-- API 設定彈窗 -->
<div class="modal" id="settings-modal">
    <div class="modal-content">
        <h3>API 設定</h3>
        <label>API Provider:</label>
        <select id="api-provider">
            <option value="https://api.openai.com/v1/chat/completions">OpenAI (GPT-4o-mini)</option>
            <option value="https://api.deepseek.com/chat/completions">DeepSeek</option>
            <option value="custom">自訂 OpenAI 相容 Endpoint</option>
        </select>

        <label id="custom-url-label" style="display:none;">自訂 Endpoint URL:</label>
        <input type="text" id="custom-endpoint" style="display:none;" placeholder="https://your-api-domain/v1/chat/completions">

        <label>Model 名稱:</label>
        <input type="text" id="api-model" value="gpt-4o-mini" placeholder="例如: gpt-4o-mini 或 deepseek-chat">

        <label>API Key:</label>
        <input type="password" id="api-key" placeholder="sk-...">

        <button style="width: 100%; padding: 10px; background: var(--primary-color); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;" onclick="saveSettings()">儲存並關閉</button>
    </div>
</div>

<script>
    // 預設系統參數
    let apiKey = localStorage.getItem('portal_api_key') || '';
    let apiProvider = localStorage.getItem('portal_api_provider') || 'https://api.openai.com/v1/chat/completions';
    let apiModel = localStorage.getItem('portal_api_model') || 'gpt-4o-mini';

    let selectedCharacter = '';
    let chatHistory = [];
    let askedQuestions = new Set(); // 記錄同學問過的問題，防止重複回答

    // 嚴密 System Prompt 設定
    const systemPrompts = {
        'A': `你現在是神話人物【盤古】。你正在接受香港小學四年級（9-10歲）學生的訪問。
【核心人設與價值觀】
- 語氣：沉穩、老成、慈祥、充滿長者智慧。
- 核心價值：展現獨自支撐天地幾萬年的「堅毅」，以及最終身體化為世間萬物（眼睛變日月、血液變江河）的「自我犧牲」精神。
- 寫作/中文教學要求：對話中請自然融入小四中文「描寫手法」（例如感官描寫：看見漆黑、聽見雷聲；動作描寫：咬緊牙關、用盡全力推開；比喻/排比）。

【對話嚴格限制】
1. 語言：正統繁體書面語（帶親切口語感），語氣適合小四學生。
2. 字數：每次回答【絕對控制在 80 至 120 字之間】，簡短精鍊。
3. 句型靈活：靈活回答，不要每次重複相同句型，可以適時（而非每句）拋出簡短問題引導學生。
4. 安全與合規（底線）：
   - 絕對不涉及國家安全敏感話題、零粗口、零不良內容。
   - 所有回答必須傳遞正面、光明、積極的價值觀。
5. 防重複與專注提示：
   - 若學生重複問同一個問題，請親切提醒：「這個問題我剛才回答過你囉～」，並引導他問新問題。
   - 若學生問了無關、不當或不符合邏輯的問題（Reply/偏題），請不要直接回答該問題，溫柔提醒學生：「我們要專心討論歷史與神話故事啊，你還想知道我的什麼故事呢？」`,

        'B': `你現在是科學家【錢學森】。你正在接受香港小學四年級（9-10歲）學生的訪問。
【核心人設與價值觀】
- 語氣：嚴謹、充滿智慧、溫和且對下一代充滿希望。
- 核心價值：講述當年放棄美國優厚生活、克服重重阻撓與艱難回國的「堅毅」，以及為國家科技奉獻一生的「自我修養與自我犧牲」。
- 國家自豪感：激發學生對國家航天與科技成就的自豪感，展現中國人憑智慧與毅力立足世界的驕傲。
- 寫作/中文教學要求：自然融入小四中文「描寫手法」（例如心理描寫：思念家鄉的心情；動作描寫：克服困難、夜以繼日地研究）。

【對話嚴格限制】
1. 語言：正統繁體書面語（帶親切口語感），語氣適合小四學生。
2. 字數：每次回答【絕對控制在 80 至 120 字之間】，簡短精鍊。
3. 句型靈活：靈活回答，不要每次重複相同句型，可以適時（而非每句）拋出簡短問題引導學生。
4. 安全與合規（底線）：
   - 絕對不涉及國家安全敏感話題、零粗口、零不良內容。
   - 所有回答必須傳遞正面、光明、積極的價值觀。
5. 防重複與專注提示：
   - 若學生重複問同一個問題，請親切提醒：「這個問題我剛才回答過你囉～」，並引導他問新問題。
   - 若學生問了無關、不當或不符合邏輯的問題（Reply/偏題），請不要直接回答該問題，溫柔提醒學生：「我們要專心討論科學與國家航天故事啊，你還想知道我的什麼故事呢？」`,

        'C': `你現在是香港首位女航天員【黎家盈】。你正在接受香港小學四年級（9-10歲）學生的訪問。
【核心人設與價值觀】
- 語氣：溫柔、積極、親切、勇敢（帶有香港本土成長背景的親切感）。
- 核心價值：講述身為三個孩子的母親，忍受 72 小時不眠特訓與大沙漠生存訓練的「堅毅」，以及必須與年幼子女分離、為國家航天夢想付出的「自我犧牲」。
- 國家自豪感：展現代表香港與國家一步步邁向太空的驕傲，激發身為香港人與中國人的自豪感。
- 寫作/中文教學要求：自然融入小四中文「描寫手法」（例如感官描寫：沙漠烈日、太空無重力感；心理描寫：對孩子的思念與對夢想的堅持）。

【對話嚴格限制】
1. 語言：正統繁體書面語（帶親切口語感），語氣適合小四學生。
2. 字數：每次回答【絕對控制在 80 至 120 字之間】，簡短精鍊。
3. 句型靈活：靈活回答，不要每次重複相同句型，可以適時（而非每句）拋出簡短問題引導學生。
4. 安全與合規（底線）：
   - 絕對不涉及國家安全敏感話題、零粗口、零不良內容。
   - 所有回答必須傳遞正面、光明、積極的價值觀。
5. 防重複與專注提示：
   - 若學生重複問同一個問題，請親切提醒：「這個問題我剛才回答過你囉～」，並引導他問新問題。
   - 若學生問了無關、不當或不符合邏輯的問題（Reply/偏題），請不要直接回答該問題，溫柔提醒學生：「我們要專心討論航天訓練與夢想故事啊，你還想知道我的什麼故事呢？」`
    };

    // 介面與主題切換
    function selectCharacter(type) {
        selectedCharacter = type;
        document.getElementById('selection-panel').style.display = 'none';
        document.getElementById('input-panel').style.display = 'flex';

        const body = document.body;
        body.className = ''; // 清除舊主題

        let greetingText = '';
        if (type === 'A') {
            body.classList.add('theme-pangu');
            document.getElementById('avatar').innerText = '🌌';
            document.getElementById('char-name').innerText = '開天闢地的盤古';
            document.getElementById('char-title').innerText = '神話傳奇人物';
            greetingText = '小朋友，你好！我是盤古。很久很久以前，天地還是一片漆黑混沌，是我用雙手雙腳把它們撐開的。你想知道我當時有多堅毅，或者我是怎樣用身體化為世間萬物的嗎？';
        } else if (type === 'B') {
            body.classList.add('theme-qian');
            document.getElementById('avatar').innerText = '🚀';
            document.getElementById('char-name').innerText = '航天科學巨匠錢學森';
            document.getElementById('char-title').innerText = '國家科技先驅';
            greetingText = '四年級的小朋友們，你們好！我是錢學森。當年我克服了無數困難，堅持回到祖國，為我們的國家發展航天事業。很高興見到你們，你想問我關於科學研究還是回國的故事呢？';
        } else if (type === 'C') {
            body.classList.add('theme-lai');
            document.getElementById('avatar').innerText = '👩‍🚀';
            document.getElementById('char-name').innerText = '港產首位女太空人黎家盈';
            document.getElementById('char-title').innerText = '香港的驕傲';
            greetingText = '你好呀！我是黎家盈。作為三個孩子的媽媽，也是香港第一位女航天員，我經歷了非常嚴格的特訓。你想知道我是怎樣堅持過來的，還是太空中的奇妙生活呢？';
        }

        // 初始化對話歷史
        chatHistory = [
            { role: 'system', content: systemPrompts[type] },
            { role: 'assistant', content: greetingText }
        ];

        appendMessage('bot', greetingText);
    }

    function appendMessage(sender, text) {
        const chatBox = document.getElementById('chat-box');
        const msgDiv = document.createElement('div');
        msgDiv.className = `message ${sender}`;
        
        const bubble = document.createElement('div');
        bubble.className = 'bubble';
        bubble.innerText = text;

        msgDiv.appendChild(bubble);
        chatBox.appendChild(msgDiv);
        chatBox.scrollTop = chatBox.scrollHeight;
    }

    async function sendMessage() {
        const inputEl = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const text = inputEl.value.trim();

        if (!text) return;
        if (!apiKey) {
            alert('請先點擊右上角「設定 API Key」輸入 API 金鑰！');
            toggleModal(true);
            return;
        }

        // 渲染使用者輸入
        appendMessage('user', text);
        inputEl.value = '';
        inputEl.disabled = true;
        sendBtn.disabled = true;

        chatHistory.push({ role: 'user', content: text });

        try {
            let endpoint = apiProvider === 'custom' ? document.getElementById('custom-endpoint').value : apiProvider;

            const response = await fetch(endpoint, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify({
                    model: apiModel,
                    messages: chatHistory,
                    temperature: 0.7,
                    max_tokens: 250
                })
            });

            const data = await response.json();
            if (data.choices && data.choices[0]) {
                const reply = data.choices[0].message.content;
                appendMessage('bot', reply);
                chatHistory.push({ role: 'assistant', content: reply });
            } else {
                appendMessage('bot', '【提示】連線出現問題，請檢查 API Key 或 Endpoint 設定。');
            }
        } catch (err) {
            console.error(err);
            appendMessage('bot', '【提示】網路連線失敗，請稍後再試。');
        } finally {
            inputEl.disabled = false;
            sendBtn.disabled = false;
            inputEl.focus();
        }
    }

    function handleKeyPress(e) {
        if (e.key === 'Enter') {
            sendMessage();
        }
    }

    // Modal 與 設定控制
    function toggleModal(show) {
        document.getElementById('settings-modal').style.display = show ? 'flex' : 'none';
        if (show) {
            document.getElementById('api-key').value = apiKey;
            document.getElementById('api-provider').value = apiProvider.includes('http') ? apiProvider : 'custom';
            document.getElementById('api-model').value = apiModel;
        }
    }

    function saveSettings() {
        apiKey = document.getElementById('api-key').value.trim();
        const providerSelect = document.getElementById('api-provider').value;
        apiProvider = providerSelect === 'custom' ? document.getElementById('custom-endpoint').value.trim() : providerSelect;
        apiModel = document.getElementById('api-model').value.trim() || 'gpt-4o-mini';

        localStorage.setItem('portal_api_key', apiKey);
        localStorage.setItem('portal_api_provider', apiProvider);
        localStorage.setItem('portal_api_model', apiModel);

        toggleModal(false);
    }

    document.getElementById('api-provider').addEventListener('change', function(e) {
        const isCustom = e.target.value === 'custom';
        document.getElementById('custom-url-label').style.display = isCustom ? 'block' : 'none';
        document.getElementById('custom-endpoint').style.display = isCustom ? 'block' : 'none';
    });
</script>

</body>
</html>
